<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGU+ 진천점 - 강태훈 과장 명함</title>
    
    <!-- 크롬 및 모바일 브라우저 홈 화면 아이콘 설정 (얼굴 사진 즉시 반영) -->
    <link rel="icon" type="image/png" href="profile.png">
    <link rel="apple-touch-icon" href="profile.png">
    <link rel="shortcut icon" href="profile.png">

    <!-- 원스그널(OneSignal) 웹 푸시 스크립트 -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "원스그널-앱ID를-여기에-넣으세요", // 본인의 OneSignal App ID로 입력되어 있는지 확인해주세요
        });
      });
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card-container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
            padding-bottom: 40px;
        }
        .header-bg {
            background: linear-gradient(135deg, #e60012 0%, #99000b 100%);
            padding: 30px 20px 70px 20px;
            text-align: center;
            color: #ffffff;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }
        .shop-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        .profile-img-box {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background-color: #fff;
        }
        .profile-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .intro-box {
            background-color: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
        }
        .content-body {
            padding: 20px;
            margin-top: -30px;
        }
        .info-card {
            background: #ffffff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 15px;
            color: #333;
        }
        .info-item:last-child {
            margin-bottom: 0;
        }
        .info-item span {
            font-weight: bold;
            color: #555;
            width: 90px;
        }
        /* 푸시 알림 구독 버튼 스타일 */
        .push-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff8000 0%, #ff5500 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 128, 0, 0.3);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .push-btn:active {
            transform: scale(0.98);
        }
        .save-btn {
            width: 100%;
            background-color: #e60012;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(230, 0, 18, 0.3);
            margin-bottom: 20px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            text-align: center;
        }
        .menu-item {
            background: #f9f9f9;
            padding: 12px 5px;
            border-radius: 10px;
            text-decoration: none;
            color: #333;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #eee;
        }
        .menu-item div {
            font-size: 18px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- 상단 프로필 영역 -->
        <div class="header-bg">
            <div class="shop-title">LG U+ 진천점</div>
            <div class="profile-img-box">
                <!-- 얼굴 사진 파일명 profile.png 연동 -->
                <img src="profile.png" alt="강태훈 과장 프로필 사진">
            </div>
            <div class="name">강태훈 과장</div>
            <div class="intro-box">
                "정확한 비교 분석과 투명한 정보 제공을 원칙으로 합니다.<br>
                고객에게 진짜 이득이 되는 조건만 선별하여 최상의 만족을 약속드립니다."
            </div>
        </div>

        <!-- 본문 정보 영역 -->
        <div class="content-body">
            
            <!-- 정보 카드 -->
            <div class="info-card">
                <div class="info-item">
                    <span>직통전화</span> 010-4444-3353
                </div>
                <div class="info-item">
                    <span>소속매장</span> LGU+ 진천점
                </div>
                <div class="info-item">
                    <span>영업시간</span> 10:00 - 20:00 (연중무휴)
                </div>
            </div>

            <!-- ★ 추가된 푸시 알림 구독 버튼 (누르면 언제든 알림 권한 팝업이 뜸) -->
            <button class="push-btn" onclick="OneSignal.Slidedown.promptPush()">
                🔔 특가 할인 & 혜택 알림받기
            </button>

            <!-- 명함 저장 버튼 -->
            <button class="save-btn" onclick="alert('연락처 저장 기능입니다.')">
                📇 명함저장
            </button>

            <!-- 하단 빠른 메뉴 -->
            <div class="menu-grid">
                <a href="tel:010-4444-3353" class="menu-item">
                    <div>📞</div>전화걸기
                </a>
                <a href="sms:010-4444-3353" class="menu-item">
                    <div>💬</div>문자상담
                </a>
                <a href="https://m.booking.naver.com" target="_blank" class="menu-item">
                    <div>📅</div>네이버예약
                </a>
                <a href="https://pf.kakao.com" target="_blank" class="menu-item">
                    <div>💭</div>카카오채널
                </a>
            </div>

        </div>
    </div>

</body>
</html>
