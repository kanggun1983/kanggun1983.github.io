<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>LGU+ 진천점 - 강태훈 과장 디지털 명함</title>

  <!-- 메타 태그 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="LGU+ 진천점 - 강태훈 과장">
  <meta property="og:description" content="정확한 비교 분석과 투명한 정보 제공! 강태훈 과장 디지털 명함">
  <meta property="og:image" content="https://kanggun1983.github.io/phoneplace1/profile.png">
  <meta property="og:url" content="https://kanggun1983.github.io/phoneplace1/">

  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "141afa8c-c61f-4f38-98b8-bb9fb799caf8",
        serviceWorkerPath: "OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/phoneplace1/" },
        slidedown: {
          prompts: [{ type: "push", autoPrompt: true }]
        }
      });
    });

    function requestNotificationPermission() {
      const ua = navigator.userAgent.toLowerCase();
      if (ua.includes('kakao') || ua.includes('naver') || ua.includes('line')) {
        alert('카카오톡/네이버 앱 내부에서는 알림 설정이 제한됩니다.\n\n우측 상단 메뉴 [⋮]를 눌러 [Chrome으로 열기]를 선택해 주세요!');
        return;
      }
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.Notifications.requestPermission();
          alert('알림 신청 절차가 완료되었습니다!');
        } catch (err) {
          alert('알림 신청 중 오류가 발생했습니다.');
        }
      });
    }
  </script>

  <!-- 스타일시트 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --lgu-pink: #e6007e; --lgu-dark: #a8005b; --bg-color: #f1f5f9; --card-bg: #ffffff; --text-main: #0f172a; --text-sub: #475569; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
    .mobile-card { width: 100%; max-width: 400px; background: var(--card-bg); border-radius: 28px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); overflow: hidden; display: flex; flex-direction: column; }
    .header { background: linear-gradient(135deg, var(--lgu-pink) 0%, var(--lgu-dark) 100%); color: #ffffff; padding: 28px 20px 24px; text-align: center; }
    .profile-img-wrap { width: 108px; height: 108px; margin: 0 auto 12px; border-radius: 50%; border: 3.5px solid #ffffff; overflow: hidden; background-color: #ffffff; }
    .profile-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name { font-size: 22px; font-weight: 800; margin-bottom: 12px; color: #ffffff; }
    .intro-box { background: rgba(255, 255, 255, 0.15); border-radius: 14px; padding: 14px 16px; font-size: 13px; color: #ffffff; text-align: center; }
    .tab-menu { display: flex; border-bottom: 1px solid #e2e8f0; }
    .tab-btn { flex: 1; padding: 14px 2px; border: none; background: #ffffff; font-size: 13px; font-weight: 700; color: #64748b; cursor: pointer; }
    .tab-btn.active { color: var(--lgu-pink); border-bottom: 3.5px solid var(--lgu-pink); }
    .content-area { padding: 20px; background-color: #ffffff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .info-box { background: #f8fafc; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .info-item { display: flex; align-items: center; margin-bottom: 12px; font-size: 14px; }
    .info-item i { width: 28px; color: var(--lgu-pink); }
    .info-item span.label { color: var(--text-sub); width: 70px; font-weight: 500; }
    .info-item span.value { font-weight: 700; color: var(--text-main); }
    .btn-vcard { width: 100%; padding: 16px; background: var(--lgu-pink); color: #ffffff; border: none; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 16px; }
    .quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .action-btn { display: flex; flex-direction: column; align-items: center; padding: 12px 4px; border: 1px solid #cbd5e1; border-radius: 14px; text-decoration: none; color: var(--text-main); font-size: 12px; font-weight: 700; }
    .service-card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 14px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; }
    .service-card i { font-size: 20px; color: var(--lgu-pink); background: #fde8f3; padding: 12px; border-radius: 12px; }
    .event-poster-img { width: 100%; border-radius: 16px; margin-bottom: 14px; display: none; }
  </style>
</head>
<body>
  <div class="mobile-card">
    <div class="header">
      <div class="profile-img-wrap"><img id="profileImg" src="profile.png" alt="프로필"></div>
      <div class="profile-name">강태훈 과장</div>
      <div class="intro-box">"정확한 비교 분석과 투명한 정보 제공을 약속드립니다."</div>
    </div>
    <div class="tab-menu">
      <button class="tab-btn active" onclick="switchTab(event, 'profile')">프로필</button>
      <button class="tab-btn" onclick="switchTab(event, 'services')">서비스</button>
      <button class="tab-btn" onclick="switchTab(event, 'events')">이벤트</button>
    </div>
    <div class="content-area">
      <div id="tab-profile" class="tab-content active">
        <div class="info-box">
          <div class="info-item"><i class="fa-solid fa-phone"></i><span class="label">전화</span><span class="value">010-4444-3353</span></div>
        </div>
        <button class="btn-vcard" onclick="downloadVCard()"><i class="fa-solid fa-address-card"></i> 명함저장</button>
        <button class="btn-vcard" style="background: #334155;" onclick="requestNotificationPermission()"><i class="fa-solid fa-bell"></i> 혜택 알림받기</button>
      </div>
      <div id="tab-services" class="tab-content">주요 서비스 내용...</div>
      <div id="tab-events" class="tab-content">이벤트 내용...</div>
    </div>
  </div>

  <script>
    function switchTab(evt, tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      evt.currentTarget.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    function downloadVCard() {
      const vcardData = `BEGIN:VCARD\nVERSION:3.0\nFN:강태훈 과장\nORG:LGU+ 진천점\nTEL;TYPE=CELL:010-4444-3353\nEND:VCARD`;
      const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', '강태훈_과장.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
