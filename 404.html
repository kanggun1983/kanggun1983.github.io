<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LGU+ 진천점 명함</title>
  <!-- [V5.7] 🔗 미리보기 주소가 아직 없는 직원(/team/직원번호/)도 공용 명함으로 열리게 -->
  <script>
    (function () {
      var m = /^\/team\/([a-z0-9]{3,12})\/?$/.exec(location.pathname);
      if (m) { var q = new URLSearchParams(location.search); if (!q.get('s')) q.set('s', m[1]); location.replace('/team/?' + q.toString() + location.hash); }
    })();
  </script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px 16px;color:#334155">
  <p>페이지를 찾을 수 없어요.</p>
  <p><a href="/" style="color:#e6007e;font-weight:700">LGU+ 진천점 명함으로 가기</a></p>
</body>
</html>
